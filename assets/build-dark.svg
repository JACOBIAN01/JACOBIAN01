<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-label="What I build: AI agents in production, real-time systems, developer tools"><style>@font-face{font-family:'InterX';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'InterX',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-kerning:none}
.w5{font-weight:500}.w7{font-weight:700}.w8{font-weight:800}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
.fi{animation:fi 1.1s ease both}
@keyframes fi{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.spin{animation:spin 18s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pk{animation:pk 1.8s linear infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(20px);opacity:0}}</style><title>What I build: AI agents in production, real-time systems, developer tools</title><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient></defs><g class="fu" style="animation-delay:0.10s"><linearGradient id="g0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/></linearGradient><rect x="0.5" y="0.5" width="383.0" height="295" rx="20" fill="url(#g0)" stroke="#FFFFFF" stroke-opacity="0.1"/><path d="M20.5 1.0H363.5" stroke="#FFFFFF" stroke-opacity="0.18"/><rect x="28.0" y="28" width="64" height="64" rx="16" fill="#22D3EE" fill-opacity="0.14"/><g transform="translate(28.0 28)"><circle cx="32" cy="32" r="18" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-dasharray="2 4"/><circle cx="32" cy="32" r="10" fill="#22D3EE" fill-opacity=".25" class="ring"/><circle cx="32" cy="32" r="7" fill="#22D3EE"/><g class="spin" style="animation-duration:7s;transform-origin:32px 32px"><circle cx="50" cy="32" r="3.5" fill="#6366F1"/><circle cx="23" cy="16.4" r="3" fill="#A78BFA"/><circle cx="23" cy="47.6" r="3" fill="#A9B8D3"/></g></g><text x="28.0" y="142.0" class="w8 " font-size="23" fill="#E8EEF8" letter-spacing='-0.3'>AI agents in production</text><text x="28.0" y="180.0" class="w5 " font-size="17" fill="#8A9AB6" >LLM pipelines built on Claude, the</text><text x="28.0" y="207.0" class="w5 " font-size="17" fill="#8A9AB6" >GitHub API and Google Sheets that</text><text x="28.0" y="234.0" class="w5 " font-size="17" fill="#8A9AB6" >replace 50+ hours a month of manual</text><text x="28.0" y="261.0" class="w5 " font-size="17" fill="#8A9AB6" >grading.</text></g><g class="fu" style="animation-delay:0.25s"><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/></linearGradient><rect x="408.5" y="0.5" width="383.0" height="295" rx="20" fill="url(#g1)" stroke="#FFFFFF" stroke-opacity="0.1"/><path d="M428.5 1.0H771.5" stroke="#FFFFFF" stroke-opacity="0.18"/><rect x="436.0" y="28" width="64" height="64" rx="16" fill="#22D3EE" fill-opacity="0.14"/><g transform="translate(436.0 28)"><rect x="8" y="22" width="14" height="20" rx="4" fill="none" stroke="#22D3EE" stroke-width="2"/><rect x="42" y="22" width="14" height="20" rx="4" fill="none" stroke="#6366F1" stroke-width="2"/><path d="M22 32h20" stroke="#E8EEF8" stroke-opacity=".25" stroke-width="2"/><circle cx="22" cy="32" r="2.6" fill="#22D3EE" class="pk" style="animation-delay:0.0s"/><circle cx="22" cy="32" r="2.6" fill="#22D3EE" class="pk" style="animation-delay:0.6s"/><circle cx="22" cy="32" r="2.6" fill="#22D3EE" class="pk" style="animation-delay:1.2s"/></g><text x="436.0" y="142.0" class="w8 " font-size="23" fill="#E8EEF8" letter-spacing='-0.3'>Real-time systems</text><text x="436.0" y="180.0" class="w5 " font-size="17" fill="#8A9AB6" >React, TypeScript, Node.js, MongoDB,</text><text x="436.0" y="207.0" class="w5 " font-size="17" fill="#8A9AB6" >Redis and Socket.io, running in</text><text x="436.0" y="234.0" class="w5 " font-size="17" fill="#8A9AB6" >production for real users.</text></g><g class="fu" style="animation-delay:0.40s"><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/></linearGradient><rect x="816.5" y="0.5" width="383.0" height="295" rx="20" fill="url(#g2)" stroke="#FFFFFF" stroke-opacity="0.1"/><path d="M836.5 1.0H1179.5" stroke="#FFFFFF" stroke-opacity="0.18"/><rect x="844.0" y="28" width="64" height="64" rx="16" fill="#22D3EE" fill-opacity="0.14"/><g transform="translate(844.0 28)"><circle cx="32" cy="32" r="18" fill="none" stroke="#E8EEF8" stroke-opacity=".18" stroke-width="3"/><g class="spin" style="animation-duration:2.6s;transform-origin:32px 32px"><circle cx="32" cy="32" r="18" fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 84"/><circle cx="50" cy="32" r="3.5" fill="#22D3EE"/></g><circle cx="32" cy="32" r="4" fill="#6366F1" class="pulse"/></g><text x="844.0" y="142.0" class="w8 " font-size="23" fill="#E8EEF8" letter-spacing='-0.3'>Developer tools</text><text x="844.0" y="180.0" class="w5 " font-size="17" fill="#8A9AB6" >Tools that make hard concepts visible,</text><text x="844.0" y="207.0" class="w5 " font-size="17" fill="#8A9AB6" >shaped by 2,500+ live teaching</text><text x="844.0" y="234.0" class="w5 " font-size="17" fill="#8A9AB6" >sessions.</text></g></svg>