<svg xmlns="http://www.w3.org/2000/svg" width="162" height="52" viewBox="0 0 162 52" role="img" aria-label="LinkedIn"><style>@font-face{font-family:'InterX';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
