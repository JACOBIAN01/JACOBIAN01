<svg xmlns="http://www.w3.org/2000/svg" width="163" height="52" viewBox="0 0 163 52" role="img" aria-label="Portfolio"><style>@font-face{font-family:'InterX';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}
