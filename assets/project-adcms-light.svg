="w5 " font-size="19" fill="#5B6B84" >A course management platform that tracks student projects against tamper-proof GitHub</text><text x="44.0" y="193.0" class="w5 " font-size="19" fill="#5B6B84" >commit history. Its first user signed in three days after the first commit, and it syncs every</text><text x="44.0" y="222.0" class="w5 " font-size="19" fill="#5B6B84" >repository automatically three times a week. Built AI-native with Claude Code.</text></g><g class="fu" style="animation-delay:.3s"><text x="44.0" y="289.0" class="w8 " font-size="22" fill="url(#acc)" >642</text><text x="95.7" y="289.0" class="w5 " font-size="16" fill="#5B6B84" >users</text><rect x="155" y="271" width="1" height="22" fill="#0B1220" fill-opacity="0.18"/><text x="172.2" y="289.0" class="w8 " font-size="22" fill="url(#acc)" >3</text><text x="194.6" y="289.0" class="w5 " font-size="16" fill="#5B6B84" >campuses</text><rect x="290" y="271" width="1" height="22" fill="#0B1220" fill-opacity="0.18"/><text x="307.3" y="289.0" class="w8 " font-size="22" fill="url(#acc)" >2,967</text><text x="379.1" y="289.0" class="w5 " font-size="16" fill="#5B6B84" >commits captured</text><rect x="535" y="271" width="1" height="22" fill="#0B1220" fill-opacity="0.18"/><text x="551.6" y="289.0" class="w8 " font-size="22" fill="url(#acc)" >99.6%</text><text x="633.6" y="289.0" class="w5 " font-size="16" fill="#5B6B84" >sync success</text></g><g class="fu" style="animation-delay:.35s"><rect x="44" y="315" width="67" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="58.0" y="335.0" class="w7 " font-size="14" fill="#334155" >React</text><rect x="121" y="315" width="83" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="135.0" y="335.0" class="w7 " font-size="14" fill="#334155" >Express</text><rect x="214" y="315" width="95" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text 