ass="w5 " font-size="19" fill="#5B6B84" >the Call Stack, Heap, microtasks, timers and the six libuv phases step by step. Real</text><text x="44.0" y="222.0" class="w5 " font-size="19" fill="#5B6B84" >execution, not a canned animation.</text></g><g class="fu" style="animation-delay:.35s"><rect x="44" y="255" width="104" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="58.0" y="275.0" class="w7 " font-size="14" fill="#334155" >TypeScript</text><rect x="158" y="255" width="114" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="171.8" y="275.0" class="w7 " font-size="14" fill="#334155" >VS Code API</text><rect x="282" y="255" width="67" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="295.6" y="275.0" class="w7 " font-size="14" fill="#334155" >React</text><rect x="359" y="255" width="89" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="372.6" y="275.0" class="w7 " font-size="14" fill="#334155" >Node vm</text><rect x="458" y="255" width="67" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="471.5" y="275.0" class="w7 " font-size="14" fill="#334155" >acorn</text></g></svg>