<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="325" viewBox="0 0 1200 325" role="img" aria-label="Jana Academy (Live in production): A production platform with a Socket.io multiplayer quiz arena, server-side RS256 verification of Firebase tokens, Redis caching with stale fallback, and self-hosted analytics with Core Web Vitals."><style>@font-face{font-family:'InterX';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
