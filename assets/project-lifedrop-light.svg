quest feed, and WhatsApp alerts to matching donors through Cloud Functions</text><text x="44.0" y="222.0" class="w5 " font-size="19" fill="#5B6B84" >and Twilio.</text></g><g class="fu" style="animation-delay:.35s"><rect x="44" y="255" width="67" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="58.0" y="275.0" class="w7 " font-size="14" fill="#334155" >React</text><rect x="121" y="255" width="83" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="135.0" y="275.0" class="w7 " font-size="14" fill="#334155" >Express</text><rect x="214" y="255" width="90" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="228.2" y="275.0" class="w7 " font-size="14" fill="#334155" >Firestore</text><rect x="314" y="255" width="124" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="327.8" y="275.0" class="w7 " font-size="14" fill="#334155" >Firebase Auth</text><rect x="447" y="255" width="69" height="30" rx="8" fill="#0B1220" fill-opacity="0.05" stroke="#0B1220" stroke-opacity="0.1"/><text x="461.4" y="275.0" class="w7 " font-size="14" fill="#334155" >Twilio</text></g></svg>