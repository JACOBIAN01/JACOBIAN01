ss</text><rect x="471" y="315" width="109" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/><text x="484.8" y="335.0" class="w7 " font-size="14" fill="#A9B8D3" >PostgreSQL</text><rect x="590" y="315" width="67" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/><text x="604.3" y="335.0" class="w7 " font-size="14" fill="#A9B8D3" >React</text></g></svg>