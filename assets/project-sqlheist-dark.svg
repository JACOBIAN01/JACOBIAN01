<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-label="SQL Heist City (Multiplayer game · AI-native build): A multiplayer browser game that teaches SQL: every vault, heal and weapon costs a query while other players hunt you. Server-authoritative netcode, a locked-down SQLite grading sandbox and a versioned admin backend. 2.2 KB/s per client, down from 41, 9.1 ms p99 tick at 100 clients, 14 days to build."><style>@font-face{font-family:'InterX';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'InterX',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-kerning:none}
.w5{font-weight:500}.w7{font-weight:700}.w8{font-weight:800}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
.fi{animation:fi 1.1s ease both}
@keyframes fi{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.spin{animation:spin 18s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.cm{animation:cm 7s linear infinite}
