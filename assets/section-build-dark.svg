<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="01 What I build"><style>@font-face{font-family:'InterX';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'InterX';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}
text{font-family:'InterX',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-kerning:none}
.w5{font-weight:500}.w7{font-weight:700}.w8{font-weight:800}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fu{from{opacity:0;transform:translateY(14px)}}
.fi{animation:fi 1.1s ease both}
@keyframes fi{from{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.spin{animation:spin 18s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ln{animation:ln 1.4s cubic-bezier(.2,.7,.2,1) .25s both;transform-box:fill-box;transform-origin:left}
@keyframes ln{from{transform:scaleX(0)}}</style><title>01 What I build</title><defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#6366F1"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></linearGradient></defs><g class="fu"><text x="64.0" y="55.0" class="w7 " font-size="18" fill="url(#acc)" >01</text><text x="110.0" y="57.0" class="w8 " font-size="34" fill="#E8EEF8" letter-spacing='-0.5'>What I build</text></g><rect class="ln" x="337" y="44" width="863" height="1.5" fill="url(#fade)"/></svg>